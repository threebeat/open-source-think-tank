# Phase 2 readiness CI — lint, typecheck, unit, build, security, public E2E, gated E2E.
# Gated E2E requires Docker (available on GitHub-hosted runners).
# Secrets in this file are synthetic E2E fixtures only — never production credentials.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  unit:
    name: Lint, typecheck, unit, security, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run security:check
      - run: npm run backup:smoke
      - name: Production build (public-demo safe)
        run: npm run build
        env:
          APP_MODE: public-demo

  e2e-public:
    name: Public Playwright E2E
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Production build (public-demo)
        run: npm run build
        env:
          APP_MODE: public-demo
      - name: Run public E2E
        run: npx playwright test
        env:
          CI: true
          APP_MODE: public-demo
      - name: Upload public Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  e2e-gated:
    name: Gated Playwright E2E (Docker Postgres)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 60
    env:
      APP_MODE: gated
      # Synthetic local/CI fixture only — not a production secret.
      DATABASE_URL: postgres://ostt:ostt@127.0.0.1:54329/ostt_dev
      AUTH_SECRET: ostt-synth-auth-secret-e2e-not-production
      AUTH_URL: http://127.0.0.1:3000
      AUTH_E2E_CAPTURE: "1"
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Postgres and wait for health
        run: npm run db:up
      - name: Alpha reset smoke (disposable ostt_alpha_reset only)
        run: npm run alpha:reset:smoke
      - name: Migrate and seed synthetic foundation
        run: node scripts/gated-e2e-prepare.mjs
      - name: Production build (gated)
        run: npm run build
      - name: Run gated E2E (account/staff axe included)
        run: npx playwright test -c playwright.gated.config.ts
      - name: Upload gated Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gated-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
